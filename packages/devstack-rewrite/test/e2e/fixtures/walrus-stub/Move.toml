# Minimal Move package fixture for the walrus e2e stub.
#
# The walrus plugin's local-cluster mode consumes a Move package
# `movePackagePath` to skip the lifted git-source sibling (see
# `plugins/walrus/lifted-siblings/source-fetch.ts` — path (a) in the
# header). Today the deploy one-shot doesn't actually compile this
# package (the upstream cargo build bakes the walrus contracts into
# the wrapper image); the path is only consumed to dedup the sibling
# key. Still, it must exist on disk and be a syntactically valid
# package so future deploy paths that DO compile it don't trip on a
# missing-package error.
#
# Bumped together with the stub Dockerfile (see Dockerfile header).

[package]
name = "walrus_stub"
edition = "2024"
version = "0.0.1"

[dependencies]

[addresses]
walrus_stub = "0x0"
