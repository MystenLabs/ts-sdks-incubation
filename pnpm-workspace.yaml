autoInstallPeers: false
# Enforce that packages must be at least 2 days old before they're installed
# This reduces the risk of supply chain attacks from newly published packages
minimumReleaseAge: 2880
# Mysten Labs packages are first-party — apply the age gate only to
# third-party deps so we can pull SDK updates the day they ship.
minimumReleaseAgeExclude:
  - '@mysten/*'
  - '@mysten-incubation/*'
packages:
  - 'packages/**'
  - 'apps/**'
  - 'examples/*'
  - '!**/dist/**'
  # Generated artifacts may contain non-npm metadata files named package.json
  # (for example Move debug info). They are not workspace projects.
  - '!**/build/**'
  # Authored template directory shipped with `create-devstack-app`; copied
  # into a freshly scaffolded app. Not a real workspace project.
  - '!packages/create-devstack-app/template/**'
  # Vendored repositories (read-only reference for coding agents). The
  # subtree carries its own pnpm-workspace.yaml that must not nest into ours.
  - '!repos/**'

catalog:
  # @mysten/* — kept on a single shared version across the monorepo.
  '@mysten/bcs': ^1.10.0
  '@mysten/codegen': ^0.10.4
  '@mysten/dapp-kit-core': ^1.3.0
  '@mysten/dapp-kit-react': ^2.0.1
  '@mysten/deepbook-v3': ^1.3.3
  '@mysten/seal': ^1.1.1
  '@mysten/signers': ^1.0.1
  '@mysten/sui': ^2.17.0
  '@mysten/wallet-standard': ^0.20.1
  '@playwright/test': ^1.59.1
  '@tailwindcss/postcss': ^4.2.4
  '@tailwindcss/vite': ^4.2.4

  # State / data
  '@tanstack/react-query': ^5.100.0
  '@types/node': ^24.12.2
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^4.7.0
  '@vitest/ui': ^4.1.6

  # React
  ink: ^7.0.0
  react: ^19.2.5
  react-dom: ^19.2.5

  # Styling
  tailwindcss: ^4.2.4

  # Utilities
  '@stricli/core': ^1.2.7
  tsx: ^4.21.0
  turbo: ^2.7.4

  # Build / lint / test
  typescript: ^5.9.3
  # `vite` is forced to v7 by the root `pnpm.overrides.vite` regardless of
  # this floor; keep the catalog range v7-compatible so vitest matches.
  vite: ^7.3.2
  # Must stay v7-compatible: the root override pins vite to v7, and
  # vitest <4 cannot run vite 7's SSR transform (`__vite_ssr_exportName__`).
  vitest: ^4.1.6
  zod: ^3.24.1

  # GraphQL — devstack dashboard API (Pothos code-first schema + yoga host)
  graphql: ^16.11.0
  graphql-yoga: ^5.10.4
  '@pothos/core': ^4.3.0
  '@pothos/plugin-relay': ^4.4.0
  '@pothos/plugin-simple-objects': ^4.1.0
  '@pothos/plugin-with-input': ^4.1.0
  # Typed GraphQL client for the dashboard frontend (no codegen step beyond the
  # generated introspection file).
  gql.tada: ^1.8.10
  '@0no-co/graphqlsp': ^1.12.16
  # Geist type family used by the dashboard design system.
  '@fontsource-variable/geist': ^5.2.5
  '@fontsource-variable/geist-mono': ^5.2.5
  # Charts for the dashboard (design handoff uses Recharts; shadcn charts wrap it).
  recharts: ^2.15.0

  # Effect — pinned to a v4 beta that has cleared the 2-day quarantine.
  # In v4, Schema/Stream/FileSystem/Path/etc. live in core `effect`; only
  # the platform-node bindings and the vitest integration are separate.
  effect: 4.0.0-beta.65
  '@effect/platform-node': 4.0.0-beta.65
  '@effect/vitest': 4.0.0-beta.65
