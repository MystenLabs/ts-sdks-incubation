<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>devstack · colors</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-base:#07080b;--bg-panel:#0f1219;--bg-elev:#161a24;--line:rgba(255,255,255,.08);
    --tx-hi:#e8ebf2;--tx-mid:#9aa4b6;--tx-lo:#616b7d;
    --c-green:#45d483;--c-yellow:#f6c454;--c-red:#fb6f84;--c-cyan:#46baf5;--c-magenta:#df7aef;--c-blue:#8893f6;--c-white:#c6cfde;--accent:#34d8c4;
    --viz-1:#34d8c4;--viz-2:#6fa8ff;--viz-3:#c08cff;--viz-4:#f6a94b;--viz-5:#4ade80;--viz-6:#f472b6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-base);color:var(--tx-hi);font-family:"Geist",system-ui,sans-serif;padding:28px;-webkit-font-smoothing:antialiased;}
  h1{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;}
  p{color:var(--tx-mid);font-size:13px;margin:0 0 22px;}
  .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-lo);margin:0 0 10px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-bottom:24px;}
  .sw{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-panel);}
  .sw .chip{height:54px;}
  .sw .meta{padding:8px 10px;}
  .sw .name{font-size:12.5px;font-weight:540;}
  .sw .tok{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--tx-lo);}
</style></head>
<body>
  <h1>Color tokens</h1>
  <p>Semantic ColorTokens mirror the TUI display-derivation vocabulary; the viz series drives charts. Theme-aware via CSS variables.</p>
  <div class="eyebrow">Semantic</div>
  <div class="grid" id="semantic"></div>
  <div class="eyebrow">Data-viz series</div>
  <div class="grid" id="viz"></div>
  <script>
    const sem=[["--c-green","ready"],["--c-yellow","active / warn"],["--c-red","failed"],["--c-cyan","service"],["--c-magenta","account / action"],["--c-blue","package / snapshot"],["--c-white","neutral"],["--accent","accent"]];
    const viz=["--viz-1","--viz-2","--viz-3","--viz-4","--viz-5","--viz-6"];
    const card=(v,n)=>`<div class="sw"><div class="chip" style="background:var(${v})"></div><div class="meta"><div class="name">${n}</div><div class="tok">${v}</div></div></div>`;
    document.getElementById("semantic").innerHTML=sem.map(([v,n])=>card(v,n)).join("");
    document.getElementById("viz").innerHTML=viz.map((v,i)=>card(v,"series "+(i+1))).join("");
  </script>
</body></html>
