<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>devstack · spacing</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--bg-base:#07080b;--bg-panel:#0f1219;--bg-elev:#161a24;--bg-elev2:#1d2230;--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.13);--tx-hi:#e8ebf2;--tx-mid:#9aa4b6;--tx-lo:#616b7d;--accent:#34d8c4;
    --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 6px 22px -8px rgba(0,0,0,.65);--sh-3:0 24px 64px -16px rgba(0,0,0,.75);}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg-base);color:var(--tx-hi);font-family:"Geist",system-ui,sans-serif;padding:28px;-webkit-font-smoothing:antialiased;}
  h1{font-size:18px;font-weight:600;margin:0 0 4px;} p.sub{color:var(--tx-mid);font-size:13px;margin:0 0 22px;}
  .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-lo);margin:0 0 12px;}
  .grp{margin-bottom:26px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
  .mono{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--tx-lo);}
  .box{display:flex;flex-direction:column;gap:8px;align-items:center;}
</style></head>
<body>
  <h1>Radii, elevation &amp; spacing</h1>
  <p class="sub">A 4→18px radius scale, three elevation shadows, and a token-driven density spacing multiplier.</p>
  <div class="grp"><div class="eyebrow">Radii</div><div class="row" id="radii"></div></div>
  <div class="grp"><div class="eyebrow">Elevation</div><div class="row" id="elev"></div></div>
  <div class="grp"><div class="eyebrow">Spacing scale (× density)</div><div class="row" id="space" style="align-items:center"></div></div>
  <script>
    const radii=[["xs",4],["sm",6],["md",9],["lg",13],["xl",18]];
    document.getElementById("radii").innerHTML=radii.map(([n,v])=>`<div class="box"><div style="width:72px;height:56px;background:var(--bg-elev2);border:1px solid var(--line-strong);border-radius:${v}px"></div><span class="mono">${n} · ${v}</span></div>`).join("");
    const elev=[["e1","var(--sh-1)"],["e2","var(--sh-2)"],["e3","var(--sh-3)"]];
    document.getElementById("elev").innerHTML=elev.map(([n,v])=>`<div class="box"><div style="width:88px;height:56px;background:var(--bg-panel);border:1px solid var(--line);border-radius:11px;box-shadow:${v}"></div><span class="mono">${n}</span></div>`).join("");
    const sp=[4,8,12,14,18,24];
    document.getElementById("space").innerHTML=sp.map(v=>`<div class="box"><div style="width:${v}px;height:${v}px;background:var(--accent);border-radius:3px"></div><span class="mono">${v}</span></div>`).join("");
  </script>
</body></html>
