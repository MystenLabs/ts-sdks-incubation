<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>devstack · components</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  fetch("../styles.css?v=" + Date.now()).then(function (r){return r.text();}).then(function (css){
    var s=document.createElement("style");s.type="text/tailwindcss";s.textContent=css;document.head.appendChild(s);
    var t=document.createElement("script");t.src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4";document.head.appendChild(t);
  });
</script></head>
<body style="padding:28px;">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../mock.js"></script>
  <script type="text/babel" src="../components.jsx"></script>
  <script type="text/babel" src="../components-extra.jsx"></script>
  <script type="text/babel">
    const { Icon, StatusBadge, Dot, CopyChip, AddressChip, EndpointLink, CoinAmount, Banner, Switch, Kpi } = window;
    const ds = window.DS;
    function Row({ label, children }) {
      return (<div className="col" style={{ gap: 10, marginBottom: 22 }}>
        <span className="eyebrow">{label}</span>
        <div className="row wrap" style={{ gap: 12, alignItems: "center" }}>{children}</div></div>);
    }
    function Card() {
      const [sw, setSw] = React.useState(true);
      return (<div style={{ maxWidth: 820 }}>
        <h1 style={{ fontSize: 18, fontWeight: 600, margin: "0 0 4px" }}>Components</h1>
        <p style={{ color: "var(--tx-mid)", fontSize: 13, margin: "0 0 22px" }}>Core primitives from the devstack design system — all token-driven and theme-aware.</p>
        <Row label="Buttons">
          <button className="btn btn-primary"><Icon name="zap" size={14} /> Primary</button>
          <button className="btn">Default</button>
          <button className="btn btn-danger"><Icon name="trash" size={14} /> Danger</button>
          <button className="btn btn-ghost">Ghost</button>
          <button className="iconbtn"><Icon name="refresh" /></button>
        </Row>
        <Row label="Status badges">{["ready","active","acquiring","failed","idle"].map(s => <StatusBadge key={s} status={s} />)}</Row>
        <Row label="Chips & metadata">
          <span className="badge"><Dot token="green" /> badge</span>
          <CopyChip text="0x9f3a2b1c4d5e6f7a" display="0x9f3a…6f7a" />
          <AddressChip address={ds.accounts[0].address} name="deployer" />
          <EndpointLink ep={ds.endpoints[0]} />
          <CoinAmount mist={100e9} symbol="SUI" />
        </Row>
        <Row label="Switch"><Switch checked={sw} onChange={setSw} /><span style={{ fontSize: 12.5, color: sw ? "var(--c-green)" : "var(--tx-lo)" }}>{sw ? "running" : "stopped"}</span></Row>
        <Row label="Banner"><div style={{ width: "100%" }}><Banner tone="warn" title="Connection lost — showing last known state">Reconnecting to the SSE stream…</Banner></div></Row>
        <Row label="KPI tile"><div style={{ width: 220 }}><Kpi label="Services" value="7/11" sub="ready" token="green" icon="layers" /></div></Row>
      </div>);
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
  </script>
</body></html>
