<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>devstack up — TUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
	:root {
		/* Modern dark TUI palette — muted base, semantic accents */
		--bg: #0e1116;
		--bg-elev: #151a21;
		--bg-strip: #11151b;
		--border: #2a313c;
		--border-soft: #1d242d;
		--fg: #d6dde6;
		--fg-dim: #7a8696;
		--fg-mute: #4a5260;
		--accent: #6cb6ff;       /* cyan/blue — running, links */
		--ok: #57ab5a;           /* green — healthy */
		--warn: #daaa3f;         /* amber — stale, dirty */
		--err: #e5534b;          /* red — failed */
		--magenta: #b083f0;      /* magenta — supervisor */
		--gray: #768390;

		--ch: 8.6px;             /* approx character width @ 14.5px JBM */
		--lh: 22px;
		--font-size: 14.5px;
	}

	html, body {
		margin: 0;
		padding: 0;
		background: #05070a;
		color: var(--fg);
		font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
		font-size: var(--font-size);
		line-height: var(--lh);
		font-feature-settings: 'liga' 0, 'calt' 0;
		-webkit-font-smoothing: antialiased;
		text-rendering: geometricPrecision;
		overflow: hidden;
		height: 100vh;
	}

	#root { height: 100vh; }

	/* Theme presets — applied via [data-theme] on root */
	[data-theme="modern"] {
		--bg: #0e1116; --bg-elev: #151a21; --bg-strip: #11151b;
		--border: #2a313c; --border-soft: #1d242d;
		--fg: #d6dde6; --fg-dim: #7a8696; --fg-mute: #4a5260;
		--accent: #6cb6ff; --ok: #57ab5a; --warn: #daaa3f; --err: #e5534b; --magenta: #b083f0;
	}
	[data-theme="solarized"] {
		--bg: #002b36; --bg-elev: #073642; --bg-strip: #03303a;
		--border: #194a55; --border-soft: #0c3d48;
		--fg: #93a1a1; --fg-dim: #657b83; --fg-mute: #586e75;
		--accent: #268bd2; --ok: #859900; --warn: #b58900; --err: #dc322f; --magenta: #d33682;
	}
	[data-theme="gruvbox"] {
		--bg: #1d2021; --bg-elev: #282828; --bg-strip: #232526;
		--border: #3c3836; --border-soft: #2d2c2a;
		--fg: #ebdbb2; --fg-dim: #a89984; --fg-mute: #7c6f64;
		--accent: #83a598; --ok: #b8bb26; --warn: #fabd2f; --err: #fb4934; --magenta: #d3869b;
	}
	[data-theme="crt"] {
		--bg: #04130a; --bg-elev: #07200f; --bg-strip: #061a0c;
		--border: #1a4423; --border-soft: #0d2c14;
		--fg: #b3f0c2; --fg-dim: #4d9962; --fg-mute: #2f6b40;
		--accent: #7ce0a3; --ok: #4ade80; --warn: #d4d44b; --err: #ff6b6b; --magenta: #a4f0c8;
	}
	[data-theme="mono"] {
		--bg: #0a0a0a; --bg-elev: #141414; --bg-strip: #101010;
		--border: #2a2a2a; --border-soft: #1c1c1c;
		--fg: #e8e8e8; --fg-dim: #888; --fg-mute: #555;
		--accent: #ffffff; --ok: #d8d8d8; --warn: #b0b0b0; --err: #888; --magenta: #cccccc;
	}

	/* Density */
	[data-density="compact"] { --lh: 19px; --font-size: 13px; --ch: 7.7px; }
	[data-density="balanced"] { --lh: 22px; --font-size: 14.5px; --ch: 8.6px; }
	[data-density="spacious"] { --lh: 26px; --font-size: 15.5px; --ch: 9.2px; }

	body { font-size: var(--font-size); line-height: var(--lh); }

	.term {
		position: relative;
		height: 100vh;
		width: 100vw;
		background: var(--bg);
		display: flex;
		flex-direction: column;
		overflow: hidden;
	}

	/* Subtle CRT scanlines for crt theme only */
	[data-theme="crt"] .term::after {
		content: "";
		position: absolute;
		inset: 0;
		pointer-events: none;
		background: repeating-linear-gradient(
			to bottom,
			rgba(0,0,0,0) 0px,
			rgba(0,0,0,0) 2px,
			rgba(0,255,100,0.03) 3px,
			rgba(0,0,0,0) 4px
		);
		mix-blend-mode: overlay;
	}

	/* Generic typography helpers */
	.dim { color: var(--fg-dim); }
	.mute { color: var(--fg-mute); }
	.ok { color: var(--ok); }
	.warn { color: var(--warn); }
	.err { color: var(--err); }
	.acc { color: var(--accent); }
	.mag { color: var(--magenta); }
	.b { font-weight: 600; }
	.inv { background: var(--fg); color: var(--bg); padding: 0 4px; }

	pre, .pre {
		margin: 0;
		font-family: inherit;
		font-size: inherit;
		line-height: var(--lh);
		white-space: pre;
	}

	.row { display: flex; align-items: stretch; }
	.col { display: flex; flex-direction: column; }
	.grow { flex: 1 1 auto; min-height: 0; }
	.shrink0 { flex: 0 0 auto; }

	/* Header strip */
	.header {
		padding: 8px 14px;
		border-bottom: 1px solid var(--border-soft);
		background: var(--bg-elev);
		display: flex;
		align-items: center;
		gap: 18px;
		flex-wrap: wrap;
	}
	.hbadge {
		font-weight: 700;
		letter-spacing: 0.04em;
	}
	.hsep { color: var(--fg-mute); }

	/* Status table */
	.section-title {
		padding: 6px 14px 2px 14px;
		color: var(--fg-dim);
		font-size: calc(var(--font-size) - 1px);
		letter-spacing: 0.08em;
		text-transform: uppercase;
		border-bottom: 1px dashed var(--border-soft);
	}
	.status-table { padding: 4px 14px; }
	.status-row {
		display: grid;
		grid-template-columns: 2ch 32ch 12ch 10ch 1fr;
		gap: 0 16px;
		align-items: baseline;
		padding: 1px 0;
		border-radius: 2px;
	}
	.status-row.deps { color: var(--fg-mute); }
	.status-row .nm { color: var(--fg); }
	.status-row .nm.dep-pending { color: var(--fg-mute); }
	.status-row .glyph { display: inline-block; width: 2ch; }
	.status-row.row-failed .nm { color: var(--err); }
	.status-row.row-running .nm { color: var(--accent); }
	.status-row.row-healthy .nm { color: var(--fg); }
	.status-row .detail { color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

	.spin { display: inline-block; }

	/* Tab strip */
	.tab-group-label {
		padding: 0 10px 0 14px;
		color: var(--magenta);
		text-transform: uppercase;
		letter-spacing: 0.1em;
		font-size: calc(var(--font-size) - 3px);
		font-weight: 600;
		border-right: 1px dashed var(--border-soft);
		display: flex;
		align-items: center;
	}
	.tab.tab-group {
		background: var(--bg);
		border-right: 1px solid var(--border-soft);
	}
	.tab.tab-group .tab-scope-label {
		color: var(--magenta);
		text-transform: uppercase;
		letter-spacing: 0.08em;
		font-weight: 700;
		font-size: calc(var(--font-size) - 1px);
	}
	.tab.tab-group.active .tab-scope-label { color: var(--bg); }
	.tabstrip {
		display: flex;
		align-items: center;
		gap: 0;
		padding: 0 14px;
		border-top: 1px solid var(--border-soft);
		border-bottom: 1px solid var(--border-soft);
		background: var(--bg-strip);
		overflow-x: auto;
		scrollbar-width: none;
	}
	.tabstrip::-webkit-scrollbar { display: none; }
	.tab {
		padding: 4px 12px;
		color: var(--fg-dim);
		cursor: pointer;
		white-space: nowrap;
		border-right: 1px solid var(--border-soft);
		user-select: none;
	}
	.tab:hover { color: var(--fg); }
	.tab.active {
		color: var(--bg);
		background: var(--accent);
		font-weight: 600;
	}
	.tab .badge {
		display: inline-block;
		margin-left: 6px;
		padding: 0 5px;
		background: var(--err);
		color: var(--bg);
		border-radius: 8px;
		font-size: calc(var(--font-size) - 3px);
		line-height: 1.4;
		vertical-align: middle;
		font-weight: 700;
	}
	.tab.active .badge { background: var(--bg); color: var(--accent); }
	.tab .unread { color: var(--warn); margin-left: 4px; }
	.tab.active .unread { color: var(--bg); }

	.row-url {
		color: var(--accent);
		text-decoration: none;
		text-underline-offset: 3px;
	}
	.row-url:hover { text-decoration: underline; }
	.row-endpoints { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

	/* scope tag in log lines */
	.scope-tag {
		display: inline-block;
		padding: 0 6px;
		border: 1px solid;
		border-radius: 3px;
		font-size: calc(var(--font-size) - 3px);
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 0.06em;
		text-align: center;
	}

	/* Log pane */
	.log-pane {
		padding: 4px 14px;
		overflow: auto;
		background: var(--bg);
		position: relative;
		min-height: 200px;
	}
	.log-line {
		display: grid;
		grid-template-columns: 10ch 9ch 18ch 1fr;
		gap: 0 12px;
		font-variant-numeric: tabular-nums;
	}
	.log-line .ts { color: var(--fg-mute); }
	.log-line .src { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.log-line .src.sup { color: var(--magenta); }
	.log-line .msg { color: var(--fg); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
	.log-line.warn .msg { color: var(--warn); }
	.log-line.err .msg { color: var(--err); }
	.log-line.ok .msg { color: var(--ok); }
	.log-line.dim .msg { color: var(--fg-dim); }

	/* Footer */
	.footer {
		padding: 6px 14px;
		border-top: 1px solid var(--border-soft);
		background: var(--bg-elev);
		display: flex;
		gap: 18px;
		flex-wrap: wrap;
		color: var(--fg-dim);
	}
	.kbd {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		color: var(--fg);
	}
	.kbd .key {
		display: inline-block;
		padding: 0 6px;
		background: var(--bg-strip);
		border: 1px solid var(--border);
		border-radius: 3px;
		color: var(--fg);
		font-size: calc(var(--font-size) - 2px);
		min-width: 14px;
		text-align: center;
	}

	/* Shutdown panel */
	.shutdown-panel {
		padding: 8px 14px;
	}
	.shutdown-title {
		display: flex;
		gap: 14px;
		align-items: baseline;
		color: var(--warn);
		font-weight: 600;
		padding-bottom: 4px;
	}
	.shutdown-row {
		display: grid;
		grid-template-columns: 2ch 32ch 10ch 1fr;
		gap: 0 16px;
		padding: 1px 0;
	}
	.shutdown-summary {
		margin-top: 6px;
		padding-top: 4px;
		border-top: 1px dashed var(--border-soft);
	}

	/* Plain renderer preview */
	.plain {
		padding: 14px;
		overflow: auto;
		background: var(--bg);
		color: var(--fg);
	}
	.plain pre { white-space: pre-wrap; word-break: break-word; }

	.status-group { padding-bottom: 4px; }
	.group-header {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 8px 0 2px 0;
		font-size: calc(var(--font-size) - 1px);
	}
	.group-label {
		text-transform: uppercase;
		letter-spacing: 0.1em;
		font-weight: 600;
	}
	.group-rule {
		flex: 1 1 auto;
		height: 0;
		border-top: 1px dashed var(--border-soft);
	}
	.group-counts { font-variant-numeric: tabular-nums; white-space: nowrap; }

	/* Endpoints panel */
	.endpoints {
		border-top: 1px solid var(--border-soft);
		background: var(--bg-strip);
	}
	.endpoints-header {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 6px 14px;
		cursor: pointer;
		user-select: none;
		font-size: calc(var(--font-size) - 1px);
		letter-spacing: 0.04em;
	}
	.endpoints-header:hover { background: var(--bg-elev); }
	.endpoints-rule { flex: 1 1 auto; height: 0; border-top: 1px dashed var(--border-soft); }
	.endpoints-body {
		padding: 4px 14px 8px 14px;
		max-height: 30vh;
		overflow: auto;
	}
	.endpoints-empty { padding: 4px 0 6px 0; }
	.endpoint-row {
		display: grid;
		grid-template-columns: 2ch 14ch 16ch 1fr 8ch;
		gap: 0 14px;
		align-items: baseline;
		padding: 1px 0;
	}
	.endpoint-row:hover { background: var(--bg-elev); }
	.endpoint-glyph { width: 2ch; }
	.endpoint-label { color: var(--fg); }
	.endpoint-source { font-size: calc(var(--font-size) - 1px); }
	.endpoint-url {
		color: var(--accent);
		text-decoration: none;
		text-underline-offset: 3px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.endpoint-url:hover { text-decoration: underline; }
	.endpoint-copy {
		appearance: none;
		background: transparent;
		border: 1px solid var(--border-soft);
		color: var(--fg-dim);
		font-family: inherit;
		font-size: calc(var(--font-size) - 2px);
		padding: 1px 8px;
		border-radius: 3px;
		cursor: pointer;
	}
	.endpoint-copy:hover { border-color: var(--border); color: var(--fg); }

	/* Borders */
	[data-borders="single"] .pane-border { border: 1px solid var(--border-soft); }
	[data-borders="rounded"] .pane-border { border: 1px solid var(--border); border-radius: 6px; }
	[data-borders="heavy"] .pane-border { border: 2px solid var(--border); }
	[data-borders="none"] .pane-border { border: 0; }

	/* spinner animation */
	@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.25; } }
	.cursor { animation: blink 1s step-end infinite; }

	/* Small viewport guard */
	@media (max-width: 720px) {
		.status-row { grid-template-columns: 2ch 1fr 8ch 1fr; }
		.log-line { grid-template-columns: 8ch 12ch 1fr; }
	}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="simulation.jsx"></script>
<script type="text/babel" src="tui.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
